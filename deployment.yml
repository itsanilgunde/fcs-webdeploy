apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcs-web
  namespace: fcs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fcs-web
  template:
    metadata:
      labels:
        app: fcs-web
    spec:
      containers:
      - name: fcs-web
        image: anilgunde/fcs-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
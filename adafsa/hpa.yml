apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fcs-web-hpa
  namespace: fcs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fcs-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70